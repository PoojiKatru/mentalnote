[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Redirects ──────────────────────────────────────────────────────────────
# Themes went weekly, so /this-month was renamed to /this-week. Keep old links
# (shared, printed on a speaker sheet, etc.) working.
[[redirects]]
  from = "/this-month"
  to = "/this-week"
  status = 301
  force = true

[[redirects]]
  from = "/this-month/"
  to = "/this-week"
  status = 301
  force = true

# ─── Security headers (brief §10) ───────────────────────────────────────────
# Fonts are self-hosted, so there are no external font/style origins. Astro
# bundles component <script>s to hashed same-origin files, so script-src stays
# 'self' with no 'unsafe-inline'. Inline style="" attributes on the note cards
# require 'unsafe-inline' for styles only. data: covers the SVG grain/noise
# backgrounds baked into the CSS.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # When Plausible/Umami is added (brief §14): append its origin to script-src
    # and connect-src here — nothing else needs to change.

# ─── CMS admin — scoped, looser CSP so Sveltia can talk to GitHub ───────────
# The main-site rule above stays locked down; only /admin/* gets these origins.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com https://github.com https://*.githubusercontent.com"

# ─── Caching (brief §12) ────────────────────────────────────────────────────
# Hashed asset filenames -> immutable. HTML gets a short cache so content edits
# from the CMS go live quickly.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
