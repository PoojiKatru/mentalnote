# Sveltia CMS — git-based, GitHub OAuth (brief §3/§6). This config MIRRORS the
# Zod schemas in src/content.config.ts exactly. If you change a schema there,
# change it here too, or the CMS will write frontmatter the build rejects.
#
# Acceptance test (brief §3): the non-technical co-founder must be able to write
# and publish an article FROM HER PHONE, without help and without touching git.

backend:
  name: github
  repo: PoojiKatru/mentalnote
  branch: main
  # PRs only — no direct pushes to main. CMS commits follow the same path as
  # hand-written code (brief §9).
  squash_merges: true

# Create a pull request per change instead of committing straight to main.
publish_mode: editorial_workflow

# Branding so the editor feels like Mental Note (the app chrome itself can't be
# recolored — this is what the CMS exposes).
site_url: https://mentalnoteorg.netlify.app
display_url: https://mentalnoteorg.netlify.app
logo_url: /logo.svg

# Article images (founder photos, note-wall image later). Kept simple for now.
media_folder: public/uploads
public_folder: /uploads

collections:
  # ── Articles: the thing you'll write most. Kept deliberately simple. ────────
  - name: articles
    label: Articles
    label_singular: Article
    description: Write and publish an article. Fill the title and the body; the rest has sensible defaults.
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: articles/{{slug}}
    summary: '{{title}}'
    sortable_fields: [date, title]
    # No split preview pane — just a clean writing box.
    editor:
      preview: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: body
        label: Article
        widget: markdown
        hint: 'Just write. Use the toolbar for bold, headings, and links — no code needed.'
      - name: author
        label: Who wrote it
        widget: select
        default: co-founder-1
        options:
          - { label: Co-founder 1, value: co-founder-1 }
          - { label: Co-founder 2, value: co-founder-2 }
      - { name: theme, label: Theme, widget: string, default: 'Future self', hint: 'The month''s theme, e.g. "Future self".' }
      - { name: excerpt, label: One-line summary, widget: text, hint: 'The teaser shown on the Articles page.' }
      - { name: minutes, label: Reading time (minutes), widget: number, value_type: int, default: 4, min: 1 }
      - { name: date, label: Date, widget: datetime, time_format: false, format: 'YYYY-MM-DD' }
      - { name: draft, label: Keep as draft (not published yet), widget: boolean, default: true }

  # ── Themes: the weekly calendar. You'll touch this rarely. ──────────────────
  - name: themes
    label: Weekly themes
    label_singular: Theme
    description: The rolling weekly theme calendar shown on "This week".
    folder: src/content/themes
    create: true
    slug: '{{startDate}}-{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [startDate]
    editor:
      preview: false
    fields:
      - { name: name, label: Theme name, widget: string }
      - { name: prompt, label: Writing prompt, widget: text }
      - name: status
        label: Status
        widget: select
        default: upcoming
        options:
          - { label: Open now, value: open }
          - { label: Upcoming, value: upcoming }
          - { label: Archived, value: archived }
      - { name: startDate, label: Week starting (the Monday), widget: datetime, time_format: false, format: 'YYYY-MM-DD' }

  # ── Notes: the review queue. Reader submissions arrive here as "Pending
  #    review". Approve by setting Status -> Published; reject by deleting. ─────
  - name: notes
    label: Notes
    label_singular: Note
    description: Reader submissions land here as "Pending review". Read one, then set it to Published to put it on the wall — or delete it to reject it.
    folder: src/content/notes
    create: true
    slug: '{{source}}-{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{status}} · {{body}}'
    sortable_fields: [publishedAt, status]
    # One-click filter to the moderation queue.
    view_filters:
      - { label: Pending review, field: status, pattern: pending }
      - { label: Published (on the wall), field: status, pattern: published }
    editor:
      preview: false
    fields:
      - name: status
        label: Show on the wall?
        widget: select
        default: published
        options:
          - { label: Pending review (hidden), value: pending }
          - { label: Published (live on the wall), value: published }
      - { name: body, label: The note, widget: text }
      - { name: ageLabel, label: Signed (e.g. "Anonymous, 15"), widget: string, default: 'Anonymous' }
      - { name: theme, label: Theme, widget: string, default: 'Notes to your future self' }
      - name: source
        label: Where it came from
        widget: select
        default: submission
        options:
          - { label: Seed (written by us), value: seed }
          - { label: Submission (from a reader), value: submission }
      - { name: publishedAt, label: Date, widget: datetime, time_format: false, format: 'YYYY-MM-DD' }
